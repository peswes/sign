<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Westkay EdTech</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(45deg, #0a1f44, #031837, #1976d2);
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 450px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(15px);
  border-radius: 18px;
  padding: 30px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  color: #fff;
}

h2 {
  text-align: center;
  margin-bottom: 10px;
}

p {
  text-align: center;
  font-size: 13px;
  opacity: 0.8;
  margin-bottom: 25px;
}

.input-group {
  position: relative;
  margin-bottom: 18px;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
  font-size: 14px;
}

.toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color: #333;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(45deg, #1976d2, #0a1f44);
  color: white;
  font-size: 15px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.03);
}

.msg {
  text-align: center;
  margin-top: 12px;
  font-size: 13px;
}

.success { color: #00ff99; }
.error { color: #ff4d4d; }
</style>
</head>

<body>

<div class="card">
  <h2>Reset Password</h2>
  <p>Enter your new password below</p>

  <form id="form">

    <div class="input-group">
      <input type="password" id="password" placeholder="New Password" required>
      <span class="toggle" onclick="toggle('password')">👁️</span>
    </div>

    <div class="input-group">
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <span class="toggle" onclick="toggle('confirmPassword')">👁️</span>
    </div>

    <button type="submit">Reset Password</button>

    <div id="msg" class="msg"></div>

  </form>
</div>

<script>
function toggle(id) {
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
}

// GET TOKEN + EMAIL
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const email = params.get("email");

const msg = document.getElementById("msg");

// Debug (optional)
console.log("TOKEN:", token);
console.log("EMAIL:", email);

// Validate URL
if (!token || !email) {
  msg.textContent = "Invalid reset link. Please request a new one.";
  msg.className = "msg error";
}

// Submit form
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (!token || !email) {
    msg.textContent = "Missing token or email in URL";
    msg.className = "msg error";
    return;
  }

  if (password !== confirmPassword) {
    msg.textContent = "Passwords do not match";
    msg.className = "msg error";
    return;
  }

  try {
    const res = await fetch("https://sign-iota-lilac.vercel.app/api/reset-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email: email.trim(),
        token: token.trim(),
        newPassword: password
      })
    });

    const data = await res.json();

    if (res.ok) {
      msg.textContent = "Password reset successful!";
      msg.className = "msg success";

      setTimeout(() => {
        window.location.href = "signin.html";
      }, 2000);
    } else {
      msg.textContent = data.message || "Reset failed";
      msg.className = "msg error";
    }

  } catch (err) {
    console.error(err);
    msg.textContent = "Server error. Try again later.";
    msg.className = "msg error";
  }
});
</script>

</body>
</html>
